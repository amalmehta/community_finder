<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Community Finder</title>
<meta name="description" content="Real local communities by city and interest, with the concrete first step, the cost and the commitment for each.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🫂</text></svg>">
<link rel="canonical" href="https://amalmehta.github.io/community_finder/">
<meta name="theme-color" content="#fbf8f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:title" content="Community Finder">
<meta property="og:description" content="Real local groups near you, and small vetted circles that chat first and decide to meet up later.">
<meta property="og:url" content="https://amalmehta.github.io/community_finder/">
<meta property="og:image" content="https://amalmehta.github.io/community_finder/assets/social.svg">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="assets/styles.css">
<script>
  // Inline and before the stylesheet renders: avoids a flash of the wrong theme.
  try {
    var t = localStorage.getItem('fyc.theme.v1');
    if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<!-- The app bar. Tabs sit here on a wide screen and drop to a bottom bar on a
     narrow one; they are the same buttons either way. -->
<header class="appbar">
  <div class="appbar-in">
    <span class="brand">Community Finder</span>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button class="tab" id="tab-find" role="tab" aria-selected="true" aria-controls="view-find">
        <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <span>Find</span>
      </button>
      <button class="tab" id="tab-plan" role="tab" aria-selected="false" aria-controls="view-plan">
        <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4h11v16l-5.5-3.6L6.5 20z"/></svg>
        <span>Saved</span><i class="count" id="plan-count" hidden>0</i>
      </button>
      <button class="tab" id="tab-circles" role="tab" aria-selected="false" aria-controls="view-circles" hidden>
        <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9.5" cy="9.5" r="5"/><circle cx="15" cy="15" r="5"/></svg>
        <span>Circles</span><i class="count" id="circles-count" hidden>0</i>
      </button>
      <button class="tab" id="tab-messages" role="tab" aria-selected="false" aria-controls="view-messages" hidden>
        <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5a2 2 0 012-2h11a2 2 0 012 2v7a2 2 0 01-2 2H9l-4.5 3.5z"/></svg>
        <span>Inbox</span><i class="count" id="msg-count" hidden>0</i>
      </button>
      <button class="tab" id="tab-you" role="tab" aria-selected="false" aria-controls="view-you">
        <svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5.5 19.5c0-3.6 2.9-5.6 6.5-5.6s6.5 2 6.5 5.6"/></svg>
        <span>You</span>
      </button>
    </nav>
    <button class="theme-btn" id="theme-toggle" type="button" aria-label="Colour theme"></button>
  </div>
</header>

<div id="auth-gate" hidden></div>

<main id="main" tabindex="-1">
  <section id="view-find" role="tabpanel" aria-labelledby="tab-find">
    <div class="wrap">
      <div id="intake"></div>
      <div class="results" id="results" role="region" aria-live="polite" aria-label="Results" hidden></div>
    </div>
  </section>

  <section id="view-you" role="tabpanel" aria-labelledby="tab-you" hidden>
    <div class="wrap" id="you-body"></div>
  </section>

  <section id="view-circles" role="tabpanel" aria-labelledby="tab-circles" hidden>
    <div class="wrap" id="circles-body"></div>
  </section>

  <section id="view-messages" role="tabpanel" aria-labelledby="tab-messages" hidden>
    <div class="wrap" id="messages-body"></div>
  </section>

  <!-- Still its own panel so the two halves of the inbox keep separate DOM,
       but it is reached through the Inbox tab's segmented control, not a tab. -->
  <section id="view-people" role="tabpanel" aria-labelledby="tab-messages" hidden>
    <div class="wrap" id="people-body"></div>
  </section>

  <section id="view-plan" role="tabpanel" aria-labelledby="tab-plan" hidden>
    <div class="wrap" id="plan-body"></div>
  </section>
</main>

<button class="fb-tab" id="fb-tab" aria-expanded="false" aria-controls="fb-panel">Feedback</button>
<div class="fb-panel" id="fb-panel" role="dialog" aria-labelledby="fb-title" hidden>
  <h2 id="fb-title">How&rsquo;s this working?</h2>
  <div class="fb-stars" id="fb-stars" role="group" aria-label="Rating out of 5">
    <button type="button" data-v="1" aria-pressed="false" aria-label="1 star">★</button>
    <button type="button" data-v="2" aria-pressed="false" aria-label="2 stars">★</button>
    <button type="button" data-v="3" aria-pressed="false" aria-label="3 stars">★</button>
    <button type="button" data-v="4" aria-pressed="false" aria-label="4 stars">★</button>
    <button type="button" data-v="5" aria-pressed="false" aria-label="5 stars">★</button>
  </div>
  <label class="sr-only" for="fb-text">Your feedback</label>
  <textarea id="fb-text" placeholder="What worked? What was missing? Which city should we add?"></textarea>
  <div class="fb-row">
    <button class="btn sm" type="button" id="fb-send">Save</button>
    <button class="btn ghost sm" type="button" id="fb-copy">Copy</button>
    <span class="fb-thanks" id="fb-thanks" hidden>Thank you.</span>
  </div>
</div>

<script src="src/data/core.js"></script>
<script src="src/data/city-sf.js"></script>
<script src="src/data/city-nyc.js"></script>
<script src="src/data/city-chicago.js"></script>
<script src="src/data/city-seattle.js"></script>
<script src="src/data/city-austin.js"></script>
<script src="src/data/city-boston.js"></script>
<script src="src/data/city-philadelphia.js"></script>
<script src="src/data/city-dc.js"></script>
<script src="src/data/city-la.js"></script>
<script src="src/data/city-sandiego.js"></script>
<script src="src/data/city-denver.js"></script>
<script src="src/data/city-portland.js"></script>
<script src="src/data/city-minneapolis.js"></script>
<script src="src/data/universal.js"></script>
<script src="src/preferences.js"></script>
<script src="src/intake.js"></script>
<script src="src/match.js"></script>
<script src="src/art.js"></script>
<script src="src/app.js"></script>
<script src="src/social.js"></script>
<script src="src/circles.js"></script>
</body>
</html>
