# Two jobs with two different clocks. The tests answer "did this change
# break anything", so they run on every push and pull request. The link
# check answers "has the world moved on", which it does whether or not
# anyone commits, so it stays on the weekly schedule and opens an issue.
name: Tests and listing links

on:
  push:
  pull_request:
  schedule:
    # Mondays, 14:00 UTC.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, matching package.json's engines field. The server half of the
      # suite uses node:sqlite, which does not exist before 22, so on 20 it
      # could only ever have been skipped.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the app suite
        run: node tests/run-tests.js

      - name: Run the server suite
        run: node tests/run-server-tests.js

  links:
    # Only on the schedule and by hand: it makes a few hundred outbound
    # requests, which is not something to do on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check every listing link
        id: links
        run: |
          set +e
          node tools/check-links.js > report.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.txt

      - name: Report broken listings
        if: steps.links.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="Broken listing links"
          BODY_FILE=issue.md
          {
            echo "The weekly link check found listings whose links no longer resolve."
            echo
            echo "Fix each one by finding the organisation's current URL, or replace the"
            echo "listing if the group no longer exists. Then re-run:"
            echo
            echo '```bash'
            echo 'node tools/check-links.js'
            echo '```'
            echo
            echo "<details><summary>Full report</summary>"
            echo
            echo '```'
            cat report.txt
            echo '```'
            echo
            echo "</details>"
            echo
            echo "_Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}_"
          } > "$BODY_FILE"

          # Keep one open issue rather than a new one every week.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
